apiVersion: apps/v1
kind: Deployment
metadata:
  name: shola-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shola-app
  template:
    metadata:
      labels:
        app: shola-app
    spec:
      containers:
      - name: shola-app
        image: oluwatoseen/shola-app:v.1.0.2
        ports:
        - containerPort: 8080



apiVersion: v1
kind: Service
metadata:
  name: shola-app
spec:
  type: NodePort
  selector:
    app: shola-app
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30030